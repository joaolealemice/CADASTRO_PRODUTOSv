<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Estoque - POO</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Cadastro de Produtos</h1>

        <button type="button" id="btn-bootstrap" class="btn-bootstrap">Ver Conceito Bootstrap</button>

        <div class="perfil-container">
            <img src="foto-perfil.jpg" alt="Foto de Perfil" class="foto-perfil">
            <div class="perfil-texto">
              <h2>João vitor maltaca leal</h2>
              <p>2A DS - Sesi Senai</p>
            </div>
          </div>

        <form id="produto-form">
            <div class="form-group">
                <label for="nome">Nome do produto:</label>
                <input type="text" id="nome" placeholder="Ex. Notebook" required />
            </div>

            <div class="form-group">
                <label for="preco">Preço (R$):</label>
                <input type="number" id="preco" step="0.01" placeholder="Ex. 3500.00" required />
            </div>

            <div class="form-group">
                <label for="quantidade">Quantidade:</label>
                <input type="number" id="quantidade" placeholder="Ex. 5" required />
            </div>

            <div id="mensagem-erro" class="mensagem-erro" role="alert" hidden></div>

            <button type="submit" class="btn-primary">Adicionar Produto</button>
        </form>

         <div class="resumo-container">
            <h3 id="total-estoque">Total em Estoque: R$0,00</h3>
            <button id="limpar-tabela" class="btn-danger">Limpar Tudo</button>
         </div>

         <div class="form-group" id="campo-busca">
             <label for="busca">Pesquisar produto:</label>
             <input type="text" id="busca" placeholder="Digite para buscar..." />
         </div>

          <table id="tabela-produtos">
            <thead>
                <tr>
                    <th>Nome</th>
                    <th>Preço Un.</th>
                    <th>Qtd.</th>
                    <th>Subtotal</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody>
            </tbody>
          </table>
          <p id="mensagem-vazia" class="mensagem-vazia" style="display: none;">Nenhum produto encontrado.</p>
    </div>

    <!-- Modal de confirmação customizado -->
    <div id="modal-confirmacao" class="modal-overlay" hidden>
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" aria-describedby="modal-texto">
            <h2 id="modal-titulo">Confirmar ação</h2>
            <p id="modal-texto"></p>
            <div class="modal-botoes">
                <button type="button" id="modal-cancelar" class="btn-secundario">Cancelar</button>
                <button type="button" id="modal-confirmar" class="btn-danger">Confirmar</button>
            </div>
        </div>
    </div>

    <!-- Modal "Conceito Bootstrap" (conteúdo montado pelo JavaScript) -->
    <div id="modal-bootstrap" class="modal-overlay" hidden>
        <div class="modal modal-grande" role="dialog" aria-modal="true" aria-labelledby="bootstrap-titulo">
            <h2 id="bootstrap-titulo">Conceito Bootstrap</h2>
            <div id="bootstrap-conteudo"></div>
            <div class="modal-botoes">
                <button type="button" id="bootstrap-fechar" class="btn-fechar">Fechar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    
</body>
</html>
